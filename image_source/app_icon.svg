<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#37474F"/>
    </linearGradient>
    <linearGradient id="greenShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="redShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <clipPath id="discClip">
      <circle cx="256" cy="272" r="172"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- soft ground shadow under disc -->
  <ellipse cx="256" cy="410" rx="150" ry="20" fill="#000000" opacity="0.25"/>

  <!-- disc golf disc, split diagonally green/red -->
  <g clip-path="url(#discClip)">
    <rect x="60" y="60" width="450" height="450" fill="url(#greenShade)"/>
    <polygon points="428,100 428,444 84,444" fill="url(#redShade)"/>
    <!-- subtle diagonal seam highlight -->
    <line x1="428" y1="100" x2="84" y2="444" stroke="#FFFFFF" stroke-width="4" opacity="0.25"/>
  </g>

  <!-- disc rim (bevel) -->
  <circle cx="256" cy="272" r="172" fill="none" stroke="#1B1F22" stroke-width="8" opacity="0.35"/>
  <circle cx="256" cy="272" r="164" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.18"/>

  <!-- top glossy highlight -->
  <ellipse cx="205" cy="185" rx="80" ry="34" fill="#FFFFFF" opacity="0.14"/>

  <!-- center flight-plate with basket/chains pictogram -->
  <circle cx="256" cy="272" r="66" fill="#F5F5F0"/>
  <circle cx="256" cy="272" r="66" fill="none" stroke="#263238" stroke-width="4" opacity="0.25"/>

  <!-- basket pictogram -->
  <g stroke="#37474F" stroke-linecap="round" fill="none">
    <!-- top rim (where chains hang) -->
    <ellipse cx="256" cy="214" rx="26" ry="9" fill="#37474F" stroke="none"/>
    <!-- chains draping down and gathering near the pole -->
    <g stroke-width="3.5">
      <path d="M 233,218 Q 233,237 251,253"/>
      <path d="M 246,220 Q 245,236 253,252"/>
      <path d="M 266,220 Q 267,236 259,252"/>
      <path d="M 279,218 Q 279,237 261,253"/>
    </g>
    <!-- basket cage (wire mesh look) -->
    <g stroke-width="4">
      <ellipse cx="256" cy="251" rx="30" ry="8"/>
      <ellipse cx="256" cy="260" rx="26" ry="7"/>
      <line x1="226" y1="251" x2="233" y2="268"/>
      <line x1="286" y1="251" x2="279" y2="268"/>
    </g>
    <!-- closed base of the basket -->
    <ellipse cx="256" cy="268" rx="18" ry="5" fill="#37474F" stroke="none"/>
    <!-- pole running down into the ground -->
    <line x1="256" y1="268" x2="256" y2="325" stroke-width="5"/>
    <!-- ground line -->
    <line x1="239" y1="325" x2="273" y2="325" stroke-width="4"/>
  </g>
</svg>
